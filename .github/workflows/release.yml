name: Release Obsidian plugin

on:
  push:
    tags: ["*.*.*"]

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const tag = process.env.GITHUB_REF_NAME;
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (!/^\d+\.\d+\.\d+$/.test(tag) || tag !== manifest.version || tag !== packageJson.version) {
            throw new Error("The release tag must match the manifest and package versions.");
          }
          JS
      - name: Verify and build
        run: |
          npm ci
          npm run check
          npm run test
          npm run validate
          npm run build
          node skills/knowledge-ui/scripts/component-reference.mjs --check-built
      - name: Attest plugin files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          create-storage-record: false
          subject-path: |
            dist/obsidian/main.js
            dist/obsidian/manifest.json
            dist/obsidian/styles.css
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Knowledge UI $GITHUB_REF_NAME" \
            dist/obsidian/main.js dist/obsidian/manifest.json dist/obsidian/styles.css
